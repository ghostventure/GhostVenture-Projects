  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1640" y2="624" gradientUnits="userSpaceOnUse"><stop stop-color="#111B2D"/><stop offset="1" stop-color="#243858"/></linearGradient>
    <linearGradient id="glow" x1="1080" y1="40" x2="1560" y2="510" gradientUnits="userSpaceOnUse"><stop stop-color="#8272FF" stop-opacity=".27"/><stop offset="1" stop-color="#51D5B5" stop-opacity=".08"/></linearGradient>
    <linearGradient id="arch" x1="42" y1="37" x2="110" y2="74" gradientUnits="userSpaceOnUse"><stop stop-color="#B8A8FF"/><stop offset="1" stop-color="#8171FF"/></linearGradient>
  </defs>
  <rect width="1640" height="624" fill="url(#bg)"/>
  <circle cx="1390" cy="190" r="360" fill="url(#glow)"/>
  <path d="M0 548h1640" stroke="#FFFFFF" stroke-opacity=".08"/>
