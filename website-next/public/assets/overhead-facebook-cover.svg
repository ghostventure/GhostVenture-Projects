  <text x="520" y="221" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="6" fill="#B9ADFF">OVERHEAD · BUSINESS OPERATIONS</text>
  <text x="516" y="324" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="700" letter-spacing="-2.5" fill="#F7F8FC">A little less overhead.</text>
  <text x="520" y="382" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="450" fill="#C5D0E1">Customer context, useful workflows, and clearer decisions.</text>
