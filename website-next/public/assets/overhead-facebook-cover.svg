    <circle cx="218" cy="11" r="6" fill="#9D8EFF"/><text x="236" y="18" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.4" fill="#E4EAF4">WORKFLOWS</text>
    <circle cx="454" cy="11" r="6" fill="#54D6B5"/><text x="472" y="18" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.4" fill="#E4EAF4">DECISIONS</text>
