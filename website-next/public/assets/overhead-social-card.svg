<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">OverHead — Clearer business operations</title>
  <desc id="description">A command workspace that brings customers, workflows, and decisions together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#111B2D"/><stop offset="1" stop-color="#243858"/></linearGradient>
    <linearGradient id="glow" x1="780" y1="80" x2="1160" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#8272FF" stop-opacity=".27"/><stop offset="1" stop-color="#51D5B5" stop-opacity=".08"/></linearGradient>
    <linearGradient id="arch" x1="42" y1="37" x2="110" y2="74" gradientUnits="userSpaceOnUse"><stop stop-color="#B8A8FF"/><stop offset="1" stop-color="#8171FF"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="210" r="290" fill="url(#glow)"/>
  <path d="M0 525h1200" stroke="#FFFFFF" stroke-opacity=".08"/>
  <g transform="translate(74 77) scale(1.24)">
    <rect x="10" y="10" width="154" height="154" rx="38" fill="#101A2B" stroke="#FFFFFF" stroke-opacity=".13"/>
    <path d="M39 66c0-26 19-45 48-45s48 19 48 45" fill="none" stroke="url(#arch)" stroke-width="8" stroke-linecap="round"/>
    <path d="M34 67h106" fill="none" stroke="#F7F8FC" stroke-width="7" stroke-linecap="round"/>
    <path d="M47 88h33M47 105h45M47 122h27" fill="none" stroke="#D9DFF0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="103" cy="88" r="5" fill="#54D6B5"/><circle cx="115" cy="105" r="5" fill="#8171FF"/><circle cx="91" cy="122" r="5" fill="#54D6B5"/>
  </g>
  <text x="340" y="145" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="5" fill="#B9ADFF">OVERHEAD</text>
  <text x="340" y="245" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2" fill="#F7F8FC">Clearer business</text>
  <text x="340" y="322" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2" fill="#F7F8FC">operations.</text>
  <text x="342" y="382" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="450" fill="#C5D0E1">Customers, workflows, and decisions in one place.</text>
  <g transform="translate(340 455)">
    <rect width="177" height="49" rx="24.5" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".15"/>
    <circle cx="25" cy="24.5" r="5" fill="#54D6B5"/>
    <text x="43" y="30" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1" fill="#E4EAF4">CUSTOMERS</text>
    <rect x="192" width="177" height="49" rx="24.5" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".15"/>
    <circle cx="217" cy="24.5" r="5" fill="#9D8EFF"/>
    <text x="235" y="30" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1" fill="#E4EAF4">WORKFLOWS</text>
    <rect x="384" width="177" height="49" rx="24.5" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".15"/>
    <circle cx="409" cy="24.5" r="5" fill="#54D6B5"/>
    <text x="427" y="30" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="1.1" fill="#E4EAF4">DECISIONS</text>
  </g>
  <text x="76" y="587" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing=".5" fill="#9EABC1">A little less overhead.</text>
